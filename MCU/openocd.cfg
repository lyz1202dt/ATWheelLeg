# J-Link / SWD, matching the reference FOC project's probe setup.
set PROBE_INTERFACE interface/cmsis-dap.cfg
set PROBE_TRANSPORT swd
source [find $PROBE_INTERFACE]
transport select $PROBE_TRANSPORT
if {[info exists PROBE_SERIAL]} {
    adapter serial $PROBE_SERIAL
}
source [find target/stm32h7x.cfg]
if {[info exists ADAPTER_SPEED]} {
    adapter speed $ADAPTER_SPEED
}
reset_config none
