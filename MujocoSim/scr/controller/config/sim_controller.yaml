controller_manager:
  ros__parameters:
    update_rate: 500

    mujoco_sim_controller:
      type: lqr_controller/MujocoSimController

    lqr_controller:
      type: lqr_controller/LQRController

mujoco_sim_controller:
  ros__parameters:
    use_sim_time: true
    effort_limit: 20.0

lqr_controller:
  ros__parameters:
    use_sim_time: true
    imu_topic: /imu_imu_sensor/imu
    imu_pose_topic: /imu_pose_sensor/pose
    cmd_vel_topic: /cmd_vel
    effort_limit: 20.0
    mode: 0
    body_width: 0.34
    base_link_com_height: 0.1265
    centrifugal_accel_filter_alpha: 0.01
    centrifugal_force_ff_gain: 1.0
    centrifugal_force_ff_limit: 7.0
    leg_exp_length: 0.28
    vmc_kp: 250.0
    vmc_kd: 30.0
    leg_angle_diff_kp: 30.0
    leg_angle_diff_kd: 1.5
    wheel_diff_kp: 3.0
    wheel_diff_ki: 1.0
    q_diag: [10.0, 400.0, 100.0, 40.0, 600.0, 50.0]
    r_diag: [8.0, 0.5]
