controller_manager:
  ros__parameters:
    update_rate: 500

    mujoco_sim_controller:
      type: lqr_controller/MujocoSimController

    mpc_controller:
      type: mpc_controller/MPCController

mujoco_sim_controller:
  ros__parameters:
    use_sim_time: true
    effort_limit: 20.0

mpc_controller:
  ros__parameters:
    use_sim_time: true
    imu_topic: /imu_imu_sensor/imu
    leg_angle_diff_kp: 30.0
    leg_angle_diff_kd: 1.5
    wheel_diff_kp: 10.0
    wheel_diff_ki: 3.0
    q_diag: [0.08, 1.5, 70.0, 120.0, 300.0, 180.0]
    r_diag: [12.0, 8.0]
